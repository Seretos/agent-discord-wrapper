name: lint

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: Validate codex plugin.json is valid JSON
        run: jq empty .codex-plugin/plugin.json

      # The wrapped MCP is pinned to an exact npm version in BOTH manifests so npx
      # reuses one cached package. A drift between them would silently give Claude
      # and Codex different servers - and SKILL.md documents one tool inventory.
      - name: Validate the discord-mcp pin matches across manifests
        run: |
          CLAUDE_PIN=$(jq -r '.mcpServers.discord.args[-1]' .claude-plugin/plugin.json)
          CODEX_PIN=$(jq -r '.mcpServers.discord.args[-1]' .codex-plugin/plugin.json)
          echo "claude: $CLAUDE_PIN / codex: $CODEX_PIN"
          case "$CLAUDE_PIN" in
            @quadslab.io/discord-mcp@[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Pin '$CLAUDE_PIN' must be an exact @quadslab.io/discord-mcp@X.Y.Z pin"; exit 1 ;;
          esac
          if [ "$CLAUDE_PIN" != "$CODEX_PIN" ]; then
            echo "::error::Manifest pins differ: '$CLAUDE_PIN' vs '$CODEX_PIN'"
            exit 1
          fi
          echo "Pin check: OK"

      # Both secrets reach the server only through userConfig on Claude. If either
      # half of that wiring is dropped, the plugin installs cleanly and then fails
      # on every tool call (bad/missing token) or refuses to pick a guild. See AGENTS.md.
      - name: Validate the userConfig secret wiring
        run: |
          TOKEN_OPT=$(jq -r '.userConfig.bot_token // empty' .claude-plugin/plugin.json)
          if [ -z "$TOKEN_OPT" ]; then
            echo "::error::.claude-plugin/plugin.json must declare userConfig.bot_token"; exit 1
          fi
          for field in sensitive required; do
            VAL=$(jq -r ".userConfig.bot_token.$field" .claude-plugin/plugin.json)
            if [ "$VAL" != "true" ]; then
              echo "::error::userConfig.bot_token.$field must be true (got '$VAL')"; exit 1
            fi
          done
          GUILD_OPT=$(jq -r '.userConfig.guild_id // empty' .claude-plugin/plugin.json)
          if [ -z "$GUILD_OPT" ]; then
            echo "::error::.claude-plugin/plugin.json must declare userConfig.guild_id"; exit 1
          fi
          GUILD_REQ=$(jq -r '.userConfig.guild_id.required' .claude-plugin/plugin.json)
          if [ "$GUILD_REQ" != "true" ]; then
            echo "::error::userConfig.guild_id.required must be true (got '$GUILD_REQ')"; exit 1
          fi
          TOKEN_ENV=$(jq -r '.mcpServers.discord.env.DISCORD_TOKEN' .claude-plugin/plugin.json)
          if [ "$TOKEN_ENV" != '${user_config.bot_token}' ]; then
            echo "::error::mcpServers.discord.env.DISCORD_TOKEN must be '\${user_config.bot_token}' (got '$TOKEN_ENV')"; exit 1
          fi
          GUILD_ENV=$(jq -r '.mcpServers.discord.env.DISCORD_GUILD_ID' .claude-plugin/plugin.json)
          if [ "$GUILD_ENV" != '${user_config.guild_id}' ]; then
            echo "::error::mcpServers.discord.env.DISCORD_GUILD_ID must be '\${user_config.guild_id}' (got '$GUILD_ENV')"; exit 1
          fi
          echo "userConfig wiring: OK"

      # Codex has no userConfig; its manifest deliberately ships no env block so the
      # server inherits DISCORD_TOKEN / DISCORD_GUILD_ID from the launching environment.
      # A hardcoded env entry here would mean someone pasted a literal secret into the repo.
      - name: Validate codex manifest declares no secrets
        run: |
          ENVBLOCK=$(jq -r '.mcpServers.discord.env // empty' .codex-plugin/plugin.json)
          if [ -n "$ENVBLOCK" ]; then
            echo "::error::.codex-plugin/plugin.json must not set an env block for the discord server. See AGENTS.md."
            exit 1
          fi
          echo "Codex manifest: OK"

      - name: Validate no Discord bot token is committed
        run: |
          if grep -rInE '[MNO][A-Za-z0-9_-]{23,26}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,}' --exclude-dir=.git .; then
            echo "::error::A literal Discord bot token appears in the repository."
            exit 1
          fi
          echo "Secret scan: OK"

      - name: Validate SKILL.md has YAML frontmatter
        run: |
          python3 - <<'EOF'
          import re, sys
          text = open("skills/discord-wrapper/SKILL.md", encoding="utf-8").read()
          m = re.match(r"^---\n(.*?)\n---\n", text, re.DOTALL)
          if not m:
              print("::error::SKILL.md missing YAML frontmatter"); sys.exit(1)
          fm = m.group(1)
          if "name:" not in fm or "description:" not in fm:
              print("::error::SKILL.md frontmatter missing 'name' or 'description'"); sys.exit(1)
          print("SKILL.md: OK")
          EOF
